{% extends 'base.html' %}
{%block contents %}

<div class="container-fluid mt-3 " >
      <img src="{{category.image.url}}" height="400px" width="100%" alt=""/>
</div>
<div class="text-center">
    <h1 class="fw-bold">{{category.name}}</h1>
    <h2>{{category.description}}</h2>
</div>

<div>
 <div class="row">
     {% for i in more %}
     <div class="col-md-4 mb-4 ">
    <div class="card m-3" style="width: 18rem;">
  <img src="{{i.image.url}}" class="card-img-top" alt="..." style="height:150px;">
  <div class="card-body">
      <h1>{{i.name}}</h1>
      <h2>${{i.price}}</h2>
    <p class="card-text">{{i.description}}</p>
      <a href="{% url 'shop:productdetails' i.id %}" class="border bg-primary p-2 text-white">More</a>
  </div>
</div>
</div>
     {% endfor %}
 </div>
</div>

{%endblock %}
