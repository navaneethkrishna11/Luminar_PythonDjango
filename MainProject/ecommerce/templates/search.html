{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block contents %}
<body>
<div>
 <div class="row">
     {% for i in products %}
     <div class="col-md-4 mb-4 ">
    <div class="card m-3" style="width: 18rem;">
  <img src="{{i.image.url}}" class="card-img-top" alt="..." style="height:150px;">
  <div class="card-body">
      <h1>{{i.name}}</h1>
      <h2>${{i.price}}</h2>
    <p class="card-text">{{i.description}}</p>
      <a href="{% url 'shop:productdetails' i.id %}" class="border bg-primary p-2 text-white">More</a>
  </div>
</div>
</div>
     {% endfor %}
 </div>
</body>
{% endblock %}
